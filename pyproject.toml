[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilovecsv"
version = "0.1.0"
description = "Automated dataset quality and preparation for machine learning: one-click safe cleaning, review queue, auditable reports"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "pyarrow>=14"]

[project.scripts]
ilovecsv = "ilovecsv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ilovecsv = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]
